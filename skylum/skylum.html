// Horizontal coordinates of a body (RA hours, Dec deg) for an observer
// at (latDeg, lonDegEast) and a UTC instant. Az is compass convention:
// 0 = north, 90 = east. alt > 0 means above the horizon.
function altAz(ra, dec, lat, lon, date = new Date()) {
  const ha = (norm24(gmst(date) + lon / 15) - ra) * 15 * D2R;
  const phi = lat * D2R, d = dec * D2R;
  const alt = Math.asin(Math.sin(phi) * Math.sin(d) + Math.cos(phi) * Math.cos(d) * Math.cos(ha)) * R2D;
  const az = norm360(Math.atan2(Math.sin(ha),
    Math.cos(ha) * Math.sin(phi) - Math.tan(d) * Math.cos(phi)) * R2D + 180);
  return { alt, az };
}

// Whole-sky snapshot for one observer: sun + moon + catalog stars with
// horizontal coordinates and visibility flags. ECHO renders this.
function observerSky(date, lat, lon) {
  const sun = solarState(date), moon = lunarState(date);
  return {
    at: date.toISOString(), lat, lon,
    sun: { ...sun, ...altAz(sun.ra, sun.dec, lat, lon, date) },
    moon: { ...moon, ...altAz(moon.ra, moon.dec, lat, lon, date) },
    stars: STARS.map(s => ({ ...s, ...altAz(s.ra, s.dec, lat, lon, date) })),
  };
}

// ---- skylum/audio.js ----
// audio.js — SKYLUM audio lane: AFSK (BFSK) modem over real PCM.
// Wire format, bit level (LSB-first per byte):
//   4×0x55 preamble | 0xD5 start | "SKAF" magic | u16 len | payload | u16 crc
// crc = low16(FNV-1a-32(payload)). Frequencies default to a Bell-202-like
// pair (space 1200 Hz, mark 2200 Hz) at 600 baud — chosen for laptop
// speaker→mic air gaps. Decode is Goertzel energy per symbol window with
// 4-phase bit-boundary search; preamble+magic+crc gate acceptance, so a
// bad channel returns null — never a fabricated payload.
// DOM-free; the door adapter binds AudioContext/getUserMedia when present.

const MAGIC = [0x53, 0x4b, 0x41, 0x46]; // "SKAF"
const START = 0xd5;
const AFSK_DEFAULTS = Object.freeze({
  sampleRate: 48000, markHz: 2200, spaceHz: 1200, baud: 600,
});

function fnv1a32(bytes) {
  let h = 0x811c9dc5;
  for (const b of bytes) { h ^= b; h = Math.imul(h, 0x01000193) >>> 0; }
  return h;
}

const byteBits = b => Array.from({ length: 8 }, (_, i) => (b >> i) & 1);

// payload -> Float32Array PCM (mono, +100ms silence guard bands).
function afskEncode(payload, opts = {}) {
  const { sampleRate, markHz, spaceHz, baud } = { ...AFSK_DEFAULTS, ...opts };
  const crc = fnv1a32(payload);
  const frame = [
    0x55, 0x55, 0x55, 0x55, START,
    ...MAGIC, payload.length & 0xff, (payload.length >> 8) & 0xff,
    ...payload, crc & 0xffff & 0xff, ((crc & 0xffff) >> 8) & 0xff,
  ];
  const spb = sampleRate / baud;
  const guard = Math.floor(sampleRate * 0.1);
  const bits = frame.flatMap(byteBits);
  const pcm = new Float32Array(guard * 2 + Math.ceil(bits.length * spb));
  let phase = 0;
  for (let i = 0; i < bits.length; i++) {
    const f = bits[i] ? markHz : spaceHz;
    const w = 2 * Math.PI * f / sampleRate;
    for (let s = 0; s < spb; s++) {
      const idx = guard + Math.floor(i * spb) + s;
      if (idx < pcm.length) { pcm[idx] = 0.6 * Math.sin(phase); phase += w; }
    }
  }
  return pcm;
}

// Goertzel magnitude of `pcm[start..start+len)` at freq f.
function goertzel(pcm, start, len, f, sampleRate) {
  const k = 2 * Math.PI * f / sampleRate, w = 2 * Math.cos(k);
  let s0 = 0, s1 = 0, s2 = 0;
  for (let i = 0; i < len; i++) {
    s0 = pcm[start + i] + w * s1 - s2;
    s2 = s1; s1 = s0;
  }
  return s1 * s1 + s2 * s2 - w * s1 * s2;
}

// Decode a bitstream window-aligned at `phase` samples. Returns
// {payload, startBit} or null. Scans for the alternating preamble then a
// "11" pair that can only be the tail of the 0xD5 start byte.
function decodeAtPhase(pcm, offset, spb, markHz, spaceHz, sampleRate) {
  const nBits = Math.floor((pcm.length - offset) / spb) - 1;
  if (nBits < 96) return null;
  const skip = Math.floor(spb * 0.2), len = Math.floor(spb * 0.6);
  const bits = new Uint8Array(nBits);
  for (let i = 0; i < nBits; i++) {
    const at = offset + Math.floor(i * spb) + skip;
    bits[i] = goertzel(pcm, at, len, markHz, sampleRate)
      >= goertzel(pcm, at, len, spaceHz, sampleRate) ? 1 : 0;
  }
  const byteAt = i => { let b = 0; for (let k = 0; k < 8; k++) b |= bits[i + k] << k; return b; };
  let alt = 0;
  for (let i = 0; i + 8 < nBits; i++) {
    if (i > 0 && bits[i] !== bits[i - 1]) alt++; else alt = 0;
    if (alt < 24 || bits[i] !== 1 || bits[i + 1] !== 1) continue;
    const startByte = i - 6; // "11" pair is bits 6-7 of the 0xD5 start byte
    if (startByte < 0 || byteAt(startByte) !== START) continue;
    if (byteAt(startByte + 8) !== MAGIC[0] || byteAt(startByte + 16) !== MAGIC[1] ||
        byteAt(startByte + 24) !== MAGIC[2] || byteAt(startByte + 32) !== MAGIC[3]) continue;
    const lenLo = byteAt(startByte + 40), lenHi = byteAt(startByte + 48);
    const len = lenLo | (lenHi << 8);
    const need = startByte + 56 + len * 8 + 16;
    if (need > nBits) continue;
    const payload = new Uint8Array(len);
    for (let k = 0; k < len; k++) payload[k] = byteAt(startByte + 56 + k * 8);
    const crc = byteAt(startByte + 56 + len * 8) | (byteAt(startByte + 64 + len * 8) << 8);
    if ((fnv1a32(payload) & 0xffff) !== crc) continue;
    return { payload, startBit: startByte };
  }
  return null;
}

// pcm -> payload bytes | null. Tries 4 carrier phases for bit alignment.
function afskDecode(pcm, opts = {}) {
  const { sampleRate, markHz, spaceHz, baud } = { ...AFSK_DEFAULTS, ...opts };
  const spb = sampleRate / baud;
  if (!pcm || pcm.length < spb * 96) return null;
  let energy = 0;
  for (let i = 0; i < pcm.length; i += 64) energy += pcm[i] * pcm[i];
  if (energy < 1e-6) return null; // silence — honest null
  for (let phase = 0; phase < 4; phase++) {
    const hit = decodeAtPhase(pcm, Math.floor(phase * spb / 4), spb, markHz, spaceHz, sampleRate);
    if (hit) return hit.payload;
  }
  return null;
}

// Door adapter (door id 10). send() renders PCM into a live AudioContext
// and plays it — real acoustics; recv() captures mic PCM via
// ScriptProcessor and runs the same afskDecode the tests exercise.
// Unsupported environments return verdict 3 / throw — never fabricated.
function audioFskDoor({ seconds = 6, ...opts } = {}) {
  const supported = typeof AudioContext !== "undefined" ||
    (typeof globalThis !== "undefined" && typeof globalThis.AudioContext !== "undefined");
  let ctx = null, stream = null;
  const ensureCtx = () => (ctx ??= new AudioContext());
  return {
    supported,
    async send(payload) {
      if (!supported) return { verdict: 3 };
      const pcm = afskEncode(payload, opts);
      const ac = ensureCtx();
      const buf = ac.createBuffer(1, pcm.length, opts.sampleRate ?? AFSK_DEFAULTS.sampleRate);
      buf.copyToChannel(pcm, 0);
      const src = ac.createBufferSource();
      src.buffer = buf; src.connect(ac.destination); src.start();
      await new Promise(res => { src.onended = res; });
      return { verdict: 0 };
    },
    async recv(maxBytes = 1 << 20) {
      if (!supported || typeof navigator === "undefined" ||
          !navigator.mediaDevices?.getUserMedia)
        throw new Error("audio door unavailable: no AudioContext/getUserMedia");
      const ac = ensureCtx();
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const source = ac.createMediaStreamSource(stream);
      const proc = ac.createScriptProcessor(16384, 1, 1);
      const chunks = [];
      proc.onaudioprocess = ev => chunks.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
      source.connect(proc); proc.connect(ac.destination);
      await new Promise(res => setTimeout(res, seconds * 1000));
      source.disconnect(); proc.disconnect();
      stream.getTracks().forEach(t => t.stop()); stream = null;
      const pcm = new Float32Array(chunks.reduce((n, c) => n + c.length, 0));
      let at = 0; for (const c of chunks) { pcm.set(c, at); at += c.length; }
      const payload = afskDecode(pcm, { sampleRate: ac.sampleRate, ...opts });
      if (!payload) throw new Error("audio decode failed: no valid SKAF frame");
      return payload.slice(0, maxBytes);
    },
    close() { stream?.getTracks().forEach(t => t.stop()); stream = null; ctx?.close(); ctx = null; },
  };
}

// ---- skylum/doors.js ----
// doors.js — SKYLUM transport doors (LAYERS.md §3).
// Registry of named doors; every transfer produces a 42-byte receipt
// (door_id u8 | verdict u8 | fnv1a64 u64 | sha256[32], LE) via ITERON.
// DOM-free where possible; adapters degrade honestly when a browser
// capability is absent — never a stub.

const DOOR = {
  file: 0,        // browser File API pick/load
  download: 1,    // anchor/blob save
  websocket: 2,   // WebSocket looppoint/peer
  webserial: 3,   // WebSerial UART (capability-checked)
  qrDisplay: 4,   // render SKCF frame -> canvas hex/block grid
  skcsVolume: 5,  // .skcs state volume read/write via ITERON
  mesh: 6,        // WebRTC data-channel lane (mesh.js)
  netprobe: 7,    // host TCP connect probe (Node/Electron bridge only)
  serialscan: 8,  // host serial-device listing (Node/Electron bridge only)
  netifaces: 9,   // host network-interface inventory (Node/Electron bridge only)
  audiofsk: 10,   // AFSK/BFSK modem: speaker->mic air-gap lane (audio.js)
  tcprelay: 11,   // host TCP data lane (Node/Electron bridge only)
};

class DoorBus {
  constructor(iteron) {
    this.iteron = iteron;       // ITERON instance (core + state)
    this.doors = new Map();
    this.log = [];
  }

  register(id, name, adapter) {
    this.doors.set(id, { id, name, adapter, enabled: true });
    return this.doors.get(id);
  }

  // send(payload, doorId) -> receipt bytes; adapter.send may be sync/async
  async send(payload, doorId) {
    const d = this.doors.get(doorId);
    if (!d) throw new Error(`unknown door ${doorId}`);
    if (!d.enabled) return this.iteron.doorReceipt(doorId, 2, payload); // disabled verdict
    const out = await d.adapter.send(payload);
    const receipt = this.iteron.doorReceipt(doorId, out?.verdict ?? 0, payload);
    this.log.push({ door: d.name, dir: "tx", bytes: payload.length, at: Date.now() });
    return receipt;
  }

  async recv(doorId, maxBytes = 1 << 20) {
    const d = this.doors.get(doorId);
    if (!d || !d.adapter.recv) throw new Error(`door ${doorId} has no recv`);
    const data = await d.adapter.recv(maxBytes);
    this.log.push({ door: d.name, dir: "rx", bytes: data?.length ?? 0, at: Date.now() });
    return data;
  }
}

// ---------------------------------------------------------------------------
// Adapters — each returns {send, recv?} ; verdict convention: 0 ok.
// ---------------------------------------------------------------------------

// file door: read a user-picked File into bytes (browser-only).
function fileDoor(inputEl) {
  return {
    async send() { throw new Error("file door is recv-only"); },
    async recv(maxBytes) {
      const f = inputEl.files && inputEl.files[0];
      if (!f) throw new Error("no file selected");
      const buf = await f.arrayBuffer();
      return new Uint8Array(buf).slice(0, maxBytes);
    },
  };
}

// download door: save bytes via anchor (browser-only).
function downloadDoor(doc = document) {
  return {
    async send(payload, name = "skc-out.bin") {
      const a = doc.createElement("a");
      a.href = URL.createObjectURL(new Blob([payload]));
      a.download = name; a.click();
      URL.revokeObjectURL(a.href);
      return { verdict: 0 };
    },
  };
}

// websocket door: connect to ws://host:port, send payload, optionally await
// one reply frame. Real loopback-capable transport.
function websocketDoor(url, { timeoutMs = 5000 } = {}) {
  let ws = null;
  return {
    async send(payload) {
      if (!ws || ws.readyState !== 1) {
        ws = new WebSocket(url);
        await new Promise((res, rej) => {
          ws.onopen = res; ws.onerror = () => rej(new Error("ws connect failed"));
        });
      }
      ws.send(payload);
      return { verdict: 0 };
    },
    async recv(maxBytes) {
      if (!ws || ws.readyState !== 1) throw new Error("ws not open");
      return await new Promise((res, rej) => {
        const t = setTimeout(() => rej(new Error("ws recv timeout")), timeoutMs);
        ws.onmessage = ev => {
          clearTimeout(t);
          const b = ev.data instanceof ArrayBuffer ? new Uint8Array(ev.data)
            : typeof ev.data === "string" ? new TextEncoder().encode(ev.data) : null;
          res(b ? b.slice(0, maxBytes) : null);
        };
        ws.onerror = () => { clearTimeout(t); rej(new Error("ws error")); };
      });
    },
    close() { ws?.close(); },
  };
}

// webserial door: UART via WebSerial API. Honest capability check —
// navigator.serial exists only in secure contexts on supporting browsers.
function webserialDoor({ baudRate = 115200 } = {}) {
  const supported = typeof navigator !== "undefined" && !!navigator.serial;
  let port = null;
  return {
    supported,
    async send(payload) {
      if (!supported) return { verdict: 3 }; // unavailable — honest verdict
      if (!port) {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate });
      }
      const w = port.writable.getWriter();
      await w.write(payload);
      w.releaseLock();
      return { verdict: 0 };
    },
    async recv(maxBytes) {
      if (!supported || !port) throw new Error("serial unavailable");
      const r = port.readable.getReader();
      const { value } = await r.read();
      r.releaseLock();
      return value ? new Uint8Array(value).slice(0, maxBytes) : null;
    },
    async close() { await port?.close(); port = null; },
  };
}

// qr-display door: render an SKCF frame as a self-describing raster on
// canvas (shared skylum/optical.js codec — the painted grid is machine-
// decodable, not just visual). QR *generation* stays Python-side (§6).
function qrDisplayDoor(canvas) {
  const ctx = canvas.getContext("2d");
  return {
    async send(frameBytes) {
      const { n, lum } = rasterEncode(frameBytes);
      const cell = Math.max(2, Math.floor(480 / Math.max(1, n)));
      canvas.width = n * cell; canvas.height = n * cell;
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < n * n; i++) {
        const v = lum[i];
        const x = (i % n) * cell, y = Math.floor(i / n) * cell;
        ctx.fillStyle = `rgb(${v},${v},${v})`;
        ctx.fillRect(x, y, cell, cell);
      }
      return { verdict: 0 };
    },
  };
}

// ---- skylum/infer.js ----
// infer.js — SKYLUM inference door contract.
// Inference is an OS service above ITERON: requests are envelopes,
// responses carry text + an ITERON seal (fnv1a64 + sha256 of the payload).
// Backends:
//   openai       — OpenAI-compatible chat endpoint (llama.cpp --server
//                  /v1/chat/completions, Ollama, remote) — POST endpoint
//   llamacpp     — native llama.cpp server: POST {endpoint}/completion
//   whisper-http — transcription: POST multipart {file,model} to endpoint
//                  (whisper.cpp /inference or OpenAI /v1/audio/transcriptions)
//   wllama       — in-browser llama.cpp via vendored @wllama/wllama ESM +
//                  single-thread wasm; models load by URL or OPFS-cached
//                  blob (wllama's own CacheManager persists downloads)
// No endpoint/model configured => honest unavailable error, never a
// fabricated completion. `fetch` stays injectable for the HTTP backends.

const INFER_BACKENDS = Object.freeze(["openai", "llamacpp", "whisper-http", "wllama"]);
const WLLAMA_ESM = "./vendor/wllama/esm/index.js";
const WLLAMA_WASM = "./vendor/wllama/esm/single-thread/wllama.wasm";

class InferenceDoor {
  constructor(iteron, {
    kind = null, endpoint = null, model = "local", timeoutMs = 30000,
    esmUrl = WLLAMA_ESM, wasmUrl = WLLAMA_WASM, modelUrl = null,
    nCtx = 2048, nThreads = 1, wllamaModule = null, fetchImpl = null,
  } = {}) {
    this.iteron = iteron;
    this.kind = kind ?? (wllamaModule ? "wllama" : "openai");
    this.endpoint = endpoint;
    this.model = model;
    this.timeoutMs = timeoutMs;
    this.esmUrl = esmUrl;
    this.wasmUrl = wasmUrl;
    this.modelUrl = modelUrl;
    this.nCtx = nCtx;
    this.nThreads = nThreads;
    this._wllamaModule = wllamaModule;
    this._w = null;
    this._modelLoaded = false;
    this._fetch = fetchImpl ?? ((...a) => fetch(...a));
  }

  get available() {
    if (this.kind === "wllama") return !!(this._wllamaModule || this.esmUrl);
    return !!this.endpoint;
  }
  get modelLoaded() { return this._modelLoaded; }

  // build the request envelope (pure — testable without fetch)
  envelope(prompt, { maxTokens = 256, system = null } = {}) {
    if (this.kind === "llamacpp") {
      return {
        prompt: system ? `${system}\n\n${prompt}` : prompt,
        n_predict: maxTokens, cache_prompt: false, stream: false,
      };
    }
    return {
      model: this.model,
      messages: [
        ...(system ? [{ role: "system", content: system }] : []),
        { role: "user", content: prompt }],
      max_tokens: maxTokens, stream: false,
    };
  }

  _url(path = "") {
    return this.kind === "llamacpp" ? `${this.endpoint.replace(/\/+$/, "")}/completion`
      : this.endpoint + path;
  }

  async _post(body, opts = {}) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), this.timeoutMs);
    let res;
    try {
      res = await this._fetch(this._url(opts.path ?? ""), {
        method: "POST",
        headers: body instanceof FormData ? {} : { "content-type": "application/json" },
        body: body instanceof FormData ? body : JSON.stringify(body),
        signal: ctrl.signal,
      });
    } finally { clearTimeout(t); }
    if (!res.ok) throw new Error(`inference http ${res.status}`);
    return res.json();
  }

  async _wllama() {
    if (this._w) return this._w;
    // esmUrl/wasmUrl accept a URL string or raw bytes (Uint8Array/Blob —
    // e.g. inflated quine members); bytes are minted as blob: URLs since
    // wllama's pathConfig only consumes strings.
    const asUrl = v => typeof v === "string" ? v
      : URL.createObjectURL(v instanceof Blob ? v : new Blob([v]));
    const mod = this._wllamaModule ?? await import(/* @vite-ignore */ asUrl(this.esmUrl));
    this._w = new mod.Wllama(
      { "single-thread/wllama.wasm": asUrl(this.wasmUrl) },
      { parallel: 1, n_threads: this.nThreads },
    );
    if (this.modelUrl) {
      await this._w.loadModelFromUrl(this.modelUrl, { n_ctx: this.nCtx });
      this._modelLoaded = true;
    }
    return this._w;
  }

  // load a GGUF model into wllama (URL string or Uint8Array/Blob bytes).
  async loadModel(source) {
    const w = await this._wllama();
    const url = typeof source === "string" ? source
      : URL.createObjectURL(source instanceof Blob ? source : new Blob([source]));
    await w.loadModelFromUrl(url, { n_ctx: this.nCtx });
    this._modelLoaded = true;
  }

  // wllama's OPFS cache inventory — [] until a backend exists.
  async cachedModels() {
    if (!this._w?.cacheManager?.list) return [];
    return this._w.cacheManager.list();
  }

  // complete(prompt) -> {text, model, usage, seal}
  async complete(prompt, opts = {}) {
    if (this.kind === "wllama") {
      const w = await this._wllama();
      if (!this._modelLoaded) throw new Error("wllama backend: no model loaded");
      const text = await w.createCompletion(prompt,
        { nPredict: opts.maxTokens ?? 256, ...(opts.sampling ? { sampling: opts.sampling } : {}) });
      return this._seal(text, this.model, null);
    }
    if (!this.endpoint) throw new Error("inference door unavailable: no endpoint");
    const json = await this._post(this.envelope(prompt, opts));
    const text = this.kind === "llamacpp" ? (json.content ?? "")
      : (json.choices?.[0]?.message?.content ?? json.text ?? "");
    const usage = this.kind === "llamacpp"
      ? {
          prompt_tokens: json.tokens_evaluated ?? null,
          completion_tokens: json.tokens_predicted ?? null,
          per_second: json.timings?.predicted_per_second ?? null,
        }
      : (json.usage ?? null);
    return this._seal(text, json.model ?? this.model, usage);
  }

  // transcribe(audioBytes|Blob) -> {text, model, seal} — whisper-http only.
  async transcribe(audio, { filename = "audio.wav" } = {}) {
    if (this.kind !== "whisper-http")
      throw new Error(`transcribe unavailable on ${this.kind} backend`);
    if (!this.endpoint) throw new Error("inference door unavailable: no endpoint");
    const form = new FormData();
    form.append("file", audio instanceof Blob ? audio : new Blob([audio]), filename);
    form.append("response_format", "json");
    if (this.model) form.append("model", this.model);
    const json = await this._post(form);
    return this._seal(json.text ?? "", json.model ?? this.model, null);
  }

  _seal(text, model, usage) {
    const payload = new TextEncoder().encode(text);
    return {
      text, model, usage,
      seal: {
        fnv1a64: this.iteron.core.fnv1a64(payload),
        sha256: this.iteron.core.sha256(payload),
      },
    };
  }
}

// ---- skylum/mesh.js ----
// mesh.js — SKYLUM overlay/mesh lane: WebRTC data-channel fabric.
// The browser-honest freenet path: no raw sockets, but real P2P data
// channels between peers. Signaling is manual (offer/answer/ICE blobs as
// base64 JSON) so it works over any door — copy/paste, websocket, QR,
// serial. Broadcast + per-peer send; every transfer gets an ITERON seal.


function meshSupported() {
  return typeof RTCPeerConnection !== "undefined";
}

// signaling blob encode/decode — pure functions, testable without RTC
function encodeSignal(desc) {
  return btoa(JSON.stringify(desc));
}
function decodeSignal(b64) {
  return JSON.parse(atob(b64));
}

class MeshNode {
  constructor(iteron, { iceServers = [] } = {}) {
    this.iteron = iteron;
    this.supported = meshSupported();
    this.iceServers = iceServers;
    this.peers = new Map();   // peerId -> {pc, dc, role, open}
    this.onData = null;       // (peerId, bytes) => void
  }

  _pc() {
    return new RTCPeerConnection({ iceServers: this.iceServers });
  }

  // create an offer for a new peer; returns {peerId, signal}
  async offer(peerId) {
    if (!this.supported) throw new Error("WebRTC unavailable");
    const pc = this._pc();
    const dc = pc.createDataChannel("skc");
    this._wire(peerId, pc, dc, "offerer");
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await this._gather(pc);
    return { peerId, signal: encodeSignal(pc.localDescription) };
  }

  // answer a remote offer; returns {peerId, signal}
  async answer(peerId, offerSignal) {
    if (!this.supported) throw new Error("WebRTC unavailable");
    const desc = decodeSignal(offerSignal);
    const pc = this._pc();
    pc.ondatachannel = ev => this._wire(peerId, pc, ev.channel, "answerer");
    await pc.setRemoteDescription(desc);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await this._gather(pc);
    return { peerId, signal: encodeSignal(pc.localDescription) };
  }

  // complete negotiation: offerer applies remote answer
  async acceptAnswer(peerId, answerSignal) {
    const p = this.peers.get(peerId);
    if (!p) throw new Error(`unknown peer ${peerId}`);
    await p.pc.setRemoteDescription(decodeSignal(answerSignal));
  }

  async _gather(pc) {
    // wait briefly for ICE gathering to finish (trickle not used —
    // candidates ride inside the description for copy/paste signaling)
    if (pc.iceGatheringState === "complete") return;
    await new Promise(res => {
      const to = setTimeout(res, 1500);
      const onState = () => {
        if (pc.iceGatheringState === "complete") {
          clearTimeout(to);
          pc.removeEventListener("icegatheringstatechange", onState);
          res();
        }
      };
      pc.addEventListener("icegatheringstatechange", onState);
    });
  }

  _wire(peerId, pc, dc, role) {
    dc.binaryType = "arraybuffer"; // ev.data arrives as ArrayBuffer
    const peer = { pc, dc, role, open: false };
    this.peers.set(peerId, peer);
    dc.onopen = () => { peer.open = true; };
    dc.onmessage = ev => {
      const bytes = typeof ev.data === "string"
        ? new TextEncoder().encode(ev.data)
        : new Uint8Array(ev.data);
      if (this.onData) this.onData(peerId, bytes);
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "failed" || pc.connectionState === "closed")
        this.peers.delete(peerId);
    };
  }

  // send bytes to one peer; returns ITERON seal receipt (door 6 = mesh)
  async send(peerId, bytes) {
    const p = this.peers.get(peerId);
    if (!p || !p.open) throw new Error(`peer ${peerId} not open`);
    p.dc.send(bytes);
    return this.iteron.doorReceipt(DOOR.mesh, 0, bytes);
  }

  // broadcast to all open peers — per-peer failures are isolated and
  // reported, never abort the remaining sends.
  async broadcast(bytes) {
    const out = [];
    for (const [id, p] of [...this.peers]) {
      if (!p.open) continue;
      try {
        p.dc.send(bytes);
        out.push({ peer: id, receipt: this.iteron.doorReceipt(DOOR.mesh, 0, bytes) });
      } catch (e) {
        out.push({ peer: id, error: String(e) });
      }
    }
    return out;
  }

  close(peerId) {
    const p = this.peers.get(peerId);
    if (p) { p.dc.close(); p.pc.close(); this.peers.delete(peerId); }
  }
}

// ---- skylum/fabric.js ----
const DEFAULT_BASE = "http://127.0.0.1:8977";
const MAX_RESPONSE_BYTES = 1 << 20;
const MUTATION_PATHS = new Set(["/v1/register", "/v1/heartbeat", "/v1/job",
  "/v1/result", "/v1/signal"]);

class FabricClient {
  constructor({ baseUrl = DEFAULT_BASE, token = "", fetchImpl = globalThis.fetch } = {}) {
    this.baseUrl = new URL(baseUrl);
    if (!["http:", "https:"].includes(this.baseUrl.protocol) || this.baseUrl.username ||
        this.baseUrl.password || this.baseUrl.pathname !== "/" || this.baseUrl.search || this.baseUrl.hash)
      throw new Error("fabric_url_invalid");
    if (typeof fetchImpl !== "function") throw new Error("fabric_fetch_unavailable");
    this.token = token;
    this.fetch = fetchImpl;
  }

  async get(path, { signal } = {}) {
    return this.request(path, { method: "GET", signal });
  }

  async post(path, body, { signal } = {}) {
    return this.request(path, { method: "POST", body: JSON.stringify(body), signal });
  }

  async request(path, options) {
    const route = path.split("?", 1)[0];
    const publicRead = /^\/v1\/(status|nodes|jobs|journal)$/.test(route);
    const privateRead = /^\/v1\/(next|signals)$/.test(route);
    if (!publicRead && !privateRead && !MUTATION_PATHS.has(route))
      throw new Error("fabric_route_invalid");
    if ((MUTATION_PATHS.has(route) || privateRead) && !this.token)
      throw new Error("fabric_token_required");
    const headers = { accept: "application/json" };
    if (options.method === "POST" || privateRead) {
      headers["content-type"] = "application/json";
      headers.authorization = `Bearer ${this.token}`;
    }
    if (options.method === "GET" && (path.startsWith("/v1/next") || path.startsWith("/v1/signals"))) {
      if (this.token) headers.authorization = `Bearer ${this.token}`;
    }
    const response = await this.fetch(new URL(path, this.baseUrl), {
      ...options, headers, cache: "no-store", redirect: "error",
    });
    const length = Number(response.headers.get("content-length") || 0);
    if (length > MAX_RESPONSE_BYTES) throw new Error("fabric_response_too_large");
    const text = await response.text();
    if (new TextEncoder().encode(text).byteLength > MAX_RESPONSE_BYTES)
      throw new Error("fabric_response_too_large");
    let data = null;
    if (text) {
      try { data = JSON.parse(text); } catch { throw new Error("fabric_response_invalid"); }
    }
    if (!response.ok) throw new Error(data?.error || `fabric_http_${response.status}`);
    return data;
  }

  status(options) { return this.get("/v1/status", options); }
  nodes(options) { return this.get("/v1/nodes", options); }
  jobs(options) { return this.get("/v1/jobs", options); }
  journal(options) { return this.get("/v1/journal?limit=50", options); }
  submitJob(job, options) { return this.post("/v1/job", job, options); }
}

function createFabricClient(options = {}) {
  return new FabricClient({
    baseUrl: options.baseUrl || (typeof process !== "undefined" && process.env.NEXT_PUBLIC_FABRIC_URL) || DEFAULT_BASE,
    token: options.token || (typeof process !== "undefined" && process.env.NEXT_PUBLIC_FABRIC_TOKEN) || "",
    ...options,
  });
}

// ---- skylum/index.js ----
// index.js — SKYLUM facade: OS services wired onto ITERON.
// Boot order: memory claims -> persistence -> seats -> doors -> infer -> mesh.
// Everything above ITERON; core invariants (formats, digests, reemit)
// stay in iteron/*.


class Skylum {
  constructor(iteron, opts = {}) {
    this.iteron = iteron;
    this.memory = new VSpace(iteron);
    this.persist = opts.persist ?? persist;
    this.seats = new Scheduler(iteron);
    this.infer = new InferenceDoor(iteron, opts.infer ?? {});
    this.mesh = new MeshNode(iteron, opts.mesh ?? {});
    this.fabric = opts.fabric?.client ?? createFabricClient(opts.fabric ?? {});
    this.optical = new OpticalLink(iteron, opts.optical ?? {});
    // stateless celestial service (pure functions) — flat handle so the
    // import-stripped quine bundle resolves the same symbols.
    this.astro = { solarState, lunarState, observerSky, altAz, gmst, STARS };
    this.bus = new DoorBus(iteron);
    this._wireDoors(opts.doors ?? {});
    this.host = Object.freeze({
      runtime: opts.host?.runtime ?? "browser",
      capabilities: Object.freeze({ ...(opts.host?.capabilities ?? {}) }),
    });
  }

  _wireDoors(hooks = {}) {
    const doc = typeof document !== "undefined" ? document : null;
    if (hooks.download !== false && doc)
      this.bus.register(DOOR.download, "download", downloadDoor(doc));
    if (hooks.file && doc)
      this.bus.register(DOOR.file, "file", fileDoor(hooks.file));
    if (hooks.websocket)
      this.bus.register(DOOR.websocket, "websocket", websocketDoor(hooks.websocket));
    if (hooks.webserial !== false) {
      const sd = webserialDoor();
      this.bus.register(DOOR.webserial, "webserial", sd);
      if (!sd.supported) this.bus.doors.get(DOOR.webserial).enabled = false;
    }
    if (hooks.qrCanvas && doc)
      this.bus.register(DOOR.qrDisplay, "qr-display", qrDisplayDoor(hooks.qrCanvas));
    if (hooks.audio !== false) {
      const ad = audioFskDoor(hooks.audioOpts ?? {});
      if (ad.supported) this.bus.register(DOOR.audiofsk, "audio-fsk", ad);
    }
    if (hooks.mesh)
      this.bus.register(DOOR.mesh, "mesh", {
        send: async bytes => {
          const r = await this.mesh.broadcast(bytes);
          return { verdict: r.every(x => !x.error) ? 0 : 1 };
        },
      });
    if (Array.isArray(hooks.extra))
      for (const extra of hooks.extra) {
        if (!extra || !Number.isInteger(extra.id) || typeof extra.name !== "string" ||
            (typeof extra.adapter?.send !== "function" &&
             typeof extra.adapter?.recv !== "function"))
          throw new Error("door_extra_invalid");
        this.bus.register(extra.id, extra.name, extra.adapter);
      }
  }

  // hydrate OS state from ITERON's current .skcs volume
  async loadState() {
    const parsed = this.iteron.core.skcsParse(this.iteron.stateBlob);
    await this.memory.load(parsed);
    return parsed;
  }

  // persist: pack claims+staging into a new state volume, optionally OPFS
  async save(name = null) {
    const blob = await this.memory.save();
    if (name) await this.persist.saveVolume(name, blob);
    return blob;
  }

  // restore a named OPFS volume into ITERON + claims
  async restore(name = "state.skcs") {
    if (typeof this.persist.loadVolume === "function") {
      const bytes = await this.persist.loadVolume(name);
      if (!bytes) return false;
      const parsed = this.iteron.core.skcsParse(bytes);
      if (!parsed) throw new Error("state_volume_malformed");
      this.iteron.stateBlob = bytes;
      await this.memory.load(parsed);
      return true;
    }
    const ok = await this.persist.loadIteron(this.iteron, name);
    if (ok) await this.loadState();
    return ok;
  }

  // status snapshot for ECHO — read-only reflection of OS state.
  // Does NOT call seats.receipt() (that mutates the audit log).
  async status() {
    const claims = [...this.memory.claims.entries()].map(([name, c]) => ({
      name, base: "0x" + c.base.toString(16), size: c.size, perms: c.perms, dirty: c.dirty,
    }));
    const seatList = [...this.seats.seats.values()].map(s => ({
      id: s.id, steps: s.steps, fuel_left: Math.max(0, s.fuel), done: s.done,
    }));
    return {
      claims, seats: seatList,
      doors: [...this.bus.doors.values()].map(d => ({ id: d.id, name: d.name, enabled: d.enabled })),
      infer: { available: this.infer.available, endpoint: this.infer.endpoint },
      mesh: { supported: meshSupported(), peers: this.mesh.peers.size },
      fabric: { configured: Boolean(this.fabric), head: this.fabric?.baseUrl?.origin ?? null },
      persist: {
        opfs: persist.opfsSupported(),
        host: this.persist.available === true,
        available: this.persist.available === true || persist.opfsSupported(),
      },
      host: this.host,
      tick: this.seats.tickCount,
    };
  }
}
