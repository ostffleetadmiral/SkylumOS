<script>
// iteron-core.js — ITERON substrate engine (DOM-free).
// Wraps the skc-wasm zero-import executor: all SKC1 formats, digests,
// member marshal for .skcs v2, store-only ZIP writer, format sniffing.
// Runs in browser and bun. Memory-detach rule: re-fetch memory.buffer
// view after every allocating call — never cache the Uint8Array view.
//
// Contract: prototypes/skyos/docs/LAYERS.md

const KIND = { file: 0, ramdump: 1, vram: 2, manifest: 3 };
const CODEC = { raw: 0, zlib: 1 }; // zig-side; "auto" resolved in JS
const CARRIER = { qr: 0, blocks: 1, rgba: 2, tcp: 3, serial: 4 };
const FRAME_CODEC = { raw: 0, encraw: 1, lemonade: 2, polyglot: 3 };
const SKCF_VERDICT = ["ok", "foreign", "bad_version", "malformed"];

const te = new TextEncoder();
const td = new TextDecoder();

// ---------------------------------------------------------------------------
// CRC-32 (IEEE) — needed for the ZIP writer; table-built once.
// ---------------------------------------------------------------------------
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xffffffff;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

// ---------------------------------------------------------------------------
// Engine
// ---------------------------------------------------------------------------
class IteronCore {
  constructor(exports) {
    this.e = exports;
  }

  static async create(wasmBytes) {
    const { instance } = await WebAssembly.instantiate(wasmBytes, {});
    return new IteronCore(instance.exports);
  }

  // -- memory helpers (detach-safe) -----------------------------------------
  view() { return new Uint8Array(this.e.memory.buffer); }

  _allocCopy(data) {
    if (data.length === 0) return 0; // zero-len slice; ptr value unused
    const p = this.e.skc_alloc(data.length);
    if (!p) throw new Error("skc_alloc failed");
    this.view().set(data, p);
    return p;
  }

  // Call an export that returns a ptr+len result; copies out before return.
  _callRet(fn, ...args) {
    const p = fn(...args);
    if (!p) return null;
    const len = this.e.skc_last_len();
    return this.view().slice(p, p + len);
  }

  _callScalar(fn, ...args) { return fn(...args); }

  // -- digests ---------------------------------------------------------------
  sha256(data) { return this._callRet(this.e.skc_sha256, this._allocCopy(data), data.length); }
  fnv1a32(data) { return this._callScalar(this.e.skc_fnv1a, this._allocCopy(data), data.length) >>> 0; }
  fnv1a64(data) { return BigInt.asUintN(64, this._callScalar(this.e.skc_fnv1a64, this._allocCopy(data), data.length)); }

  // -- lemonade ---------------------------------------------------------------
  // files: [{name, data}] -> LEML blob
  lemonadePack(manifestObj, files) {
    const mf = te.encode(JSON.stringify(manifestObj));
    const parts = [new Uint8Array(4)];
    new DataView(parts[0].buffer).setUint32(0, files.length, true);
    const chunks = [parts[0]];
    let total = 4;
    for (const f of files) {
      const nb = te.encode(f.name), db = f.data instanceof Uint8Array ? f.data : te.encode(String(f.data));
      const h = new Uint8Array(2 + nb.length + 4 + db.length);
      const dv = new DataView(h.buffer);
      dv.setUint16(0, nb.length, true);
      h.set(nb, 2);
      dv.setUint32(2 + nb.length, db.length, true);
      h.set(db, 6 + nb.length);
      chunks.push(h); total += h.length;
    }
    const flat = new Uint8Array(total);
    let off = 0;
    for (const c of chunks) { flat.set(c, off); off += c.length; }
    const mp = this._allocCopy(mf), fp = this._allocCopy(flat);
    return this._callRet(this.e.lemonade_pack, mp, mf.length, fp, flat.length);
  }

  // LEML blob -> {manifest: object, files: [{name, data}]}
  lemonadeUnpack(blob) {
    const p = this._allocCopy(blob);
    const raw = this._callRet(this.e.lemonade_unpack, p, blob.length);
    if (!raw) return null;
    const dv = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
    let pos = 0;
    const mlen = dv.getUint32(pos, true); pos += 4;
    const manifest = JSON.parse(td.decode(raw.subarray(pos, pos + mlen))); pos += mlen;
    const count = dv.getUint32(pos, true); pos += 4;
    const files = [];
    for (let i = 0; i < count; i++) {
      const nl = dv.getUint16(pos, true); pos += 2;
      const name = td.decode(raw.subarray(pos, pos + nl)); pos += nl;
      const dl = dv.getUint32(pos, true); pos += 4;
      files.push({ name, data: raw.slice(pos, pos + dl) }); pos += dl;
    }
    return { manifest, files };
  }

  // -- FSK --------------------------------------------------------------------
  fskEncode(data, baud = 1200) {
    const p = this._allocCopy(data);
    return this._callRet(this.e.fsk_encode, p, data.length, baud);
  }
  fskDecode(wav, baud = 1200) {
    const p = this._allocCopy(wav);
    return this._callRet(this.e.fsk_decode, p, wav.length, baud);
  }

  // -- fountain ---------------------------------------------------------------
  // framesBlob format: u32 nframes | per frame {u32 len, frame bytes}
  fountainEncode(payload, blockLen = 900, sessionId = 0x5ac1, count = 0) {
    const p = this._allocCopy(payload);
    return this._callRet(this.e.fountain_encode, p, payload.length, blockLen, sessionId, count);
  }
  fountainDecode(framesBlob, totalLen, blockLen = 900, sessionId = 0x5ac1) {
    const p = this._allocCopy(framesBlob);
    return this._callRet(this.e.fountain_decode, p, framesBlob.length, totalLen, blockLen, sessionId);
  }

  // iterate decoded frames from a frames blob
  *iterFrames(framesBlob) {
    const dv = new DataView(framesBlob.buffer, framesBlob.byteOffset, framesBlob.byteLength);
    const n = dv.getUint32(0, true);
    let pos = 4;
    for (let i = 0; i < n; i++) {
      const len = dv.getUint32(pos, true); pos += 4;
      yield framesBlob.slice(pos, pos + len); pos += len;
    }
  }

  // -- SKCF single-frame parse -------------------------------------------------
  // -> {verdict, verdictName, session_id, seq, k, block_len, total_len,
  //     fnv1a, codec_id, carrier_id, flags, payload_len} or null fields
  skcfParse(frame) {
    const p = this._allocCopy(frame);
    const raw = this._callRet(this.e.skcf_parse, p, frame.length);
    if (!raw || raw.length < 1) return null;
    const dv = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
    const verdict = dv.getUint8(0);
    const r = { verdict, verdictName: SKCF_VERDICT[verdict] ?? "?" };
    if (verdict === 0 && raw.length >= 26) {
      let pos = 1;
      r.session_id = dv.getUint16(pos, true); pos += 2;
      r.seq = dv.getUint32(pos, true); pos += 4;
      r.k = dv.getUint16(pos, true); pos += 2;
      r.block_len = dv.getUint16(pos, true); pos += 2;
      r.total_len = dv.getUint32(pos, true); pos += 4;
      r.fnv1a = dv.getUint32(pos, true); pos += 4;
      r.codec_id = dv.getUint8(pos); pos += 1;
      r.carrier_id = dv.getUint8(pos); pos += 1;
      r.flags = dv.getUint8(pos); pos += 1;
      r.payload_len = dv.getUint32(pos, true);
    }
    return r;
  }

  // -- .skcs v2 ----------------------------------------------------------------
  // members: [{kind, codec('raw'|'zlib'|'auto'), name, sha256?(auto), data(Uint8Array),
  //           media?, meta?}]  -> .skcs bytes
  async skcsPack(members, flags = 0) {
    // resolve codec "auto": compress-probe via CompressionStream when available
    const resolved = [];
    for (const m of members) {
      let codec = m.codec ?? "raw";
      let data = m.data instanceof Uint8Array ? m.data : te.encode(String(m.data));
      if (codec === "auto") {
        const comp = await deflateRaw(data).catch(() => null);
        codec = comp && comp.length < data.length ? "zlib" : "raw";
      }
      resolved.push({ ...m, codec, data });
    }
    // build member table — contiguous per-member record:
    // {u8 kind, u8 codec, u16 name_len, name, sha256[32], u32 data_len,
    //  data, u16 media_len, media, u32 meta_len, meta}
    const enc = new TextEncoder();
    const parts = [];
    const head = new Uint8Array(4);
    new DataView(head.buffer).setUint32(0, resolved.length, true);
    parts.push(head);
    for (const m of resolved) {
      const nb = enc.encode(m.name);
      const media = m.media ? enc.encode(m.media) : new Uint8Array(0);
      const meta = m.meta ? (typeof m.meta === "string" ? enc.encode(m.meta) : m.meta) : new Uint8Array(0);
      const sha = m.sha256 instanceof Uint8Array ? m.sha256 : this.sha256(m.data);
      const rec = new Uint8Array(2 + 2 + nb.length + 32 + 4 + m.data.length + 2 + media.length + 4 + meta.length);
      const dv = new DataView(rec.buffer);
      let pos = 0;
      dv.setUint8(pos, KIND[m.kind] ?? KIND.file); pos += 1;
      dv.setUint8(pos, CODEC[m.codec] ?? 0); pos += 1;
      dv.setUint16(pos, nb.length, true); pos += 2;
      rec.set(nb, pos); pos += nb.length;
      rec.set(sha, pos); pos += 32;
      dv.setUint32(pos, m.data.length, true); pos += 4;
      rec.set(m.data, pos); pos += m.data.length;
      dv.setUint16(pos, media.length, true); pos += 2;
      rec.set(media, pos); pos += media.length;
      dv.setUint32(pos, meta.length, true); pos += 4;
      rec.set(meta, pos);
      parts.push(rec);
    }
    const total = parts.reduce((a, c) => a + c.length, 0);
    const flat = new Uint8Array(total);
    let off = 0;
    for (const c of parts) { flat.set(c, off); off += c.length; }
    const p = this._allocCopy(flat);
    return this._callRet(this.e.skcs_pack, p, flat.length, flags);
  }

  // .skcs bytes -> {flags, members:[{kind,kindName,codec,codecName,name,size,
  //   raw_size,offset,media,meta,data(stored bytes)}]}
  // NOTE: member.data is STORED bytes — inflate via inflateMember() when codec=1.
  skcsParse(blob) {
    const p = this._allocCopy(blob);
    const raw = this._callRet(this.e.skcs_parse, p, blob.length);
    if (!raw || raw.length < 6) return null;
    const dv = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
    let pos = 0;
    const magicOk = dv.getUint8(pos); pos += 1;
    const flags = dv.getUint8(pos); pos += 1;
    const count = dv.getUint32(pos, true); pos += 4;
    if (!magicOk) return { flags, members: [] };
    const KINDN = ["file", "ramdump", "vram", "manifest"];
    const CODECN = ["raw", "zlib"];
    const members = [];
    for (let i = 0; i < count; i++) {
      const kind = dv.getUint8(pos); pos += 1;
      const codec = dv.getUint8(pos); pos += 1;
      const nl = dv.getUint16(pos, true); pos += 2;
      const name = td.decode(raw.subarray(pos, pos + nl)); pos += nl;
      const size = Number(dv.getBigUint64(pos, true)); pos += 8;
      const rawSize = Number(dv.getBigUint64(pos, true)); pos += 8;
      const offset = Number(dv.getBigUint64(pos, true)); pos += 8;
      const ml = dv.getUint16(pos, true); pos += 2;
      const media = td.decode(raw.subarray(pos, pos + ml)); pos += ml;
      const metaLen = dv.getUint32(pos, true); pos += 4;
      const meta = raw.slice(pos, pos + metaLen); pos += metaLen;
      const dl = dv.getUint32(pos, true); pos += 4;
      const data = raw.slice(pos, pos + dl); pos += dl;
      members.push({
        kind, kindName: KINDN[kind] ?? "?", codec, codecName: CODECN[codec] ?? "?",
        name, size, raw_size: rawSize, offset, media,
        meta: td.decode(meta), data,
      });
    }
    return { flags, members };
  }

  // inflate a stored member payload (codec=1 -> raw deflate)
  async inflateMember(m) {
    if (m.codec !== 1) return m.data;
    return inflateRaw(m.data, m.raw_size);
  }
}

// ---------------------------------------------------------------------------
// CompressionStream helpers (capability-detected)
// ---------------------------------------------------------------------------
async function deflateRaw(data) {
  if (typeof CompressionStream === "undefined") return null;
  try {
    const cs = new CompressionStream("deflate-raw");
    const stream = new Blob([data]).stream().pipeThrough(cs);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  } catch { return null; }
}

async function inflateRaw(data, expectedLen = 0) {
  if (typeof DecompressionStream === "undefined") throw new Error("no DecompressionStream");
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([data]).stream().pipeThrough(ds);
  const out = new Uint8Array(await new Response(stream).arrayBuffer());
  if (expectedLen && out.length !== expectedLen) throw new Error(`inflate size mismatch ${out.length}!=${expectedLen}`);
  return out;
}

// ---------------------------------------------------------------------------
// Store-only ZIP writer (method 0) — .skc interchange emit, ITERON side.
// files: [{name, data(Uint8Array)}] -> zip bytes (crc32 + EOCD verified).
// ---------------------------------------------------------------------------
function zipStore(files) {
  const enc = te;
  const chunks = [];
  const central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name);
    const data = f.data instanceof Uint8Array ? f.data : enc.encode(String(f.data));
    const crc = crc32(data);
    const lh = new Uint8Array(30 + name.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);   // version needed
    dv.setUint16(6, 0x0800, true); // UTF-8 flag
    dv.setUint16(8, 0, true);    // method: store
    dv.setUint16(10, 0, true); dv.setUint16(12, 0, true); // time/date
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, name.length, true);
    dv.setUint16(28, 0, true);
    lh.set(name, 30);
    chunks.push(lh, data);

    const ch = new Uint8Array(46 + name.length);
    const cdv = new DataView(ch.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true); cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0x0800, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, 0, true); cdv.setUint16(14, 0, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, data.length, true);
    cdv.setUint32(24, data.length, true);
    cdv.setUint16(28, name.length, true);
    // extra/comment/disk/attrs all zero
    cdv.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);
    offset += lh.length + data.length;
  }
  const cdStart = offset;
  const cdLen = central.reduce((a, c) => a + c.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdLen, true);
  ev.setUint32(16, cdStart, true);
  const total = offset + cdLen + 22;
  const out = new Uint8Array(total);
  let pos = 0;
  for (const c of chunks) { out.set(c, pos); pos += c.length; }
  for (const c of central) { out.set(c, pos); pos += c.length; }
  out.set(eocd, pos);
  return out;
}

// ---------------------------------------------------------------------------
// Format sniff — LAYERS.md §5 order. Returns {format, offset}.
// ---------------------------------------------------------------------------
function sniff(buf) {
  const v = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  const s = (off, str) => {
    if (v.length < off + str.length) return false;
    for (let i = 0; i < str.length; i++) if (v[off + i] !== str.charCodeAt(i)) return false;
    return true;
  };
  if (s(0, "PK\x03\x04")) return { format: "skc", offset: 0 };
  if (s(0, "SKC1")) return { format: "skcs", offset: 0 };
  if (s(0, "LEML")) return { format: "lemonade", offset: 0 };
  if (s(0, "RIFF")) return { format: "wav", offset: 0 };
  if (s(0, "OCS1")) return { format: "encraw", offset: 0 };
  if (s(0, "SK") && v.length > 2 && v[2] === 1) return { format: "skcf", offset: 0 };
  if (v.length > 5 && (s(0, "<!--") || s(0, "<htm") || s(0, "<!DO"))) return { format: "html", offset: 0 };
  return { format: "raw", offset: 0 };
}

// iteron.js — ITERON quine-runtime (browser side).
// Boots the engine from embedded slots, exposes window.ITERON, implements
// reemit() per LAYERS.md §4.
//
// Slot law (dot3/vSuper pattern): the artifact carries __TEMPLATE_B64__ —
// base64 of template.html itself. The decoded template still contains the
// literal markers __WASM_B64__/__STATE_B64__/__MANIFEST__/__ENGINE__/
// __TEMPLATE_B64__, so reemit() = decode template → substitute slots →
// byte-identical HTML iff inputs unchanged.


const B64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

function b64encode(bytes) {
  // chunked — spread-arg btoa blows the stack on large blobs
  let bin = "";
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}

const SLOT_IDS = {
  wasm: "iteron-wasm",
  state: "iteron-state",
  manifest: "iteron-manifest",
  tmpl: "iteron-tmpl",
  extraBoot: "iteron-extra-boot",
};

class Iteron {
  // parts: {wasmB64, stateB64, manifestStr, engineSrc, tmplB64}
  constructor(core, stateBlob, manifest, parts) {
    this.core = core;
    this.stateBlob = stateBlob;
    this.manifest = manifest;
    this.parts = parts;
    // canonical manifest string — reemit() reuses it verbatim so output is
    // byte-identical; mutate via setManifest() which re-serializes.
    this.manifestStr = parts.manifestStr ?? JSON.stringify(manifest).replaceAll("<", "\\u003c");
  }

  setManifest(obj) {
    this.manifest = obj;
    this.manifestStr = JSON.stringify(obj).replaceAll("<", "\\u003c");
  }

  static async boot(doc = document) {
    const g = id => doc.getElementById(id).textContent;
    const parts = {
      wasmB64: g(SLOT_IDS.wasm).trim(),
      stateB64: g(SLOT_IDS.state).trim(),
      manifestStr: g(SLOT_IDS.manifest),
      tmplB64: g(SLOT_IDS.tmpl).trim(),
      engineSrc: g("iteron-engine-src"),
      extraBootSrc: doc.getElementById(SLOT_IDS.extraBoot)?.textContent ?? "",
    };
    const core = await IteronCore.create(B64(parts.wasmB64));
    const manifest = JSON.parse(parts.manifestStr);
    return new Iteron(core, B64(parts.stateB64), manifest, parts);
  }

  // reemit(): regenerate artifact HTML from current state. Pure function —
  // testable in bun without DOM.
  reemit() {
    const tmplBytes = B64(this.parts.tmplB64);
    const tmpl = new TextDecoder().decode(tmplBytes);
    const wasmMarker = "__WASM_" + "B64__";
    const stateMarker = "__STATE_" + "B64__";
    const vendorMarker = "__VENDOR_" + "B64__";
    const manifestMarker = "__MANI" + "FEST__";
    const desktopBootMarker = "__DESKTOP_" + "BOOT__";
    const extraBootMarker = "__EXTRA_" + "BOOT__";
    const templateSlotMarker = "__TEMPLATE_" + "B64__";
    // order matters: __TEMPLATE_B64__ before __ENGINE__ — engineSrc contains
    // the literal marker strings (its own replaceAll calls) which must
    // survive verbatim, exactly as make_quine.py substitutes them.
    // __EXTRA_BOOT__ likewise precedes __ENGINE__.
    return tmpl
      .replaceAll(wasmMarker, this.parts.wasmB64)
      .replaceAll(vendorMarker, this.parts.vendorB64 ?? "")
      .replaceAll(stateMarker, this.parts.vendorB64 ? this.parts.stateB64 : b64encode(this.stateBlob))
      .replaceAll(manifestMarker, this.manifestStr)
      .replaceAll(templateSlotMarker, this.parts.tmplB64)
      .replaceAll(extraBootMarker, this.parts.extraBootSrc ?? "")
      .replaceAll("__ENGINE__", this.parts.engineSrc)
      .replaceAll(desktopBootMarker, this.parts.desktopBootSrc ?? "");
  }

  // inspect the state volume (.skcs) — inflates codec members
  async inspect() {
    const parsed = this.core.skcsParse(this.stateBlob);
    const members = [];
    for (const m of parsed?.members ?? []) {
      members.push({ ...m, data: await this.core.inflateMember(m) });
    }
    return { flags: parsed?.flags ?? 0, members };
  }

  // commit a new state volume
  async commit(members, flags = 0) {
    this.stateBlob = await this.core.skcsPack(members, flags);
    return this.stateBlob;
  }

  // door receipt per LAYERS.md §3: door_id u8 | verdict u8 | fnv1a64 u64 |
  // sha256[32] — 42 bytes, little-endian.
  doorReceipt(doorId, verdict, payload) {
    const r = new Uint8Array(42);
    const dv = new DataView(r.buffer);
    dv.setUint8(0, doorId);
    dv.setUint8(1, verdict);
    dv.setBigUint64(2, this.core.fnv1a64(payload), true);
    r.set(this.core.sha256(payload), 10);
    return r;
  }
}

// engine globals for the boot harness
window.IteronCore = IteronCore;
window.Iteron = Iteron;
window.SKC = { KIND, CODEC, CARRIER, FRAME_CODEC, SKCF_VERDICT,
               crc32, zipStore, sniff, deflateRaw, inflateRaw, b64encode };

// ---- skylum/state.js ----
// state.js — SKYLUM OS state: claims mapped onto .skcs member kinds.
// Persistence = ITERON skcs_pack/skcs_parse roundtrip; claims carry
// metadata in member.meta (JSON) so the volume stays self-describing.


// claim kinds -> .skcs member kinds (LAYERS.md §1)
const CLAIM_KIND = {
  file: KIND.file,        // ordinary payload file
  ramdump: KIND.ramdump,  // memory region image {base,size,perms}
  vram: KIND.vram,        // framebuffer {width,height,format,pitch}
  manifest: KIND.manifest,// OS manifest / claim table
};

const KIND_NAMES = ["file", "ramdump", "vram", "manifest"];

// Build a member record for the ITERON skcs_pack ABI.
function claimMember(name, data, { kind = "file", media = "", meta = {} } = {}) {
  return {
    kind,
    codec: "auto",           // ITERON resolves raw/zlib per member
    name,
    data: data instanceof Uint8Array ? data : new TextEncoder().encode(String(data)),
    media,
    meta: Object.keys(meta).length ? JSON.stringify(meta) : "",
  };
}

// Parse meta JSON safely.
function claimMeta(member) {
  try { return member.meta ? JSON.parse(member.meta) : {}; }
  catch { return {}; }
}

// SKYLUM claim table -> member list for iteron.commit()
class ClaimSpace {
  constructor() { this.claims = new Map(); }

  put(name, data, opts = {}) {
    const m = claimMember(name, data, opts);
    this.claims.set(name, m);
    return m;
  }

  // typed helpers
  putRamdump(name, bytes, { base = "0x0", size = null, perms = "rw" } = {}) {
    return this.put(name, bytes, {
      kind: "ramdump", media: "raw",
      meta: { base, size: size ?? bytes.length, perms },
    });
  }

  putVram(name, rgba, { width, height, format = "rgba8", pitch = width * 4 } = {}) {
    return this.put(name, rgba, {
      kind: "vram", media: format,
      meta: { width, height, format, pitch },
    });
  }

  putManifest(obj) {
    return this.put("MANIFEST.json", JSON.stringify(obj, null, 2),
      { kind: "manifest", media: "application/json" });
  }

  members() { return [...this.claims.values()]; }

  // persist: pack claims into a new .skcs state volume via ITERON.
  // Members may be claimMember products (raw data) OR raw skcsParse
  // output (stored bytes, numeric kind/codec) — normalize both through
  // inflateMember + claimMember so skcsPack always sees raw data.
  async save(iteron, flags = 0) {
    const out = [];
    for (const m of this.claims.values()) {
      const raw = await iteron.core.inflateMember(m);
      const kind = typeof m.kind === "number"
        ? (KIND_NAMES[m.kind] ?? "file") : (m.kind ?? "file");
      out.push(claimMember(m.name, raw, {
        kind, media: m.media ?? "", meta: claimMeta(m),
      }));
    }
    return iteron.commit(out, flags);
  }

  // load: hydrate claims from a parsed .skcs volume. Members keep their
  // parsed shape (stored bytes); save() normalizes before packing.
  load(parsed) {
    this.claims.clear();
    for (const m of parsed?.members ?? []) {
      this.claims.set(m.name, m);
    }
    return this;
  }
}

// ---- skylum/memory.js ----
// memory.js — SKYLUM VSpace: claim/memory management over .skcs volumes.
// Claims are .skcs members; addresses are claim indices + offsets.
// The staging arena is a reserved member (__staging) — covo's 1 MiB
// staging boundary: external bytes land there before commit.
//
// Codec law: skcsParse yields STORED member bytes (possibly zlib); the
// VSpace normalizes every member to RAW data + codec "auto" on load so
// skcsPack always receives raw input — never double-compressed.


const STAGING_MEMBER = "__staging";
const STAGING_SIZE = 1 << 20; // 1 MiB staging arena

const HEAP_BASE = 0x10000;

class VSpace {
  constructor(iteron) {
    this.iteron = iteron;
    this.claims = new Map();   // name -> {member, base, size, perms, dirty}
    this.heapTop = HEAP_BASE;
    this.staging = null;       // normalized member record (raw data)
  }

  // hydrate from a parsed .skcs volume — ASYNC: inflates stored members
  async load(parsed) {
    this.claims.clear();
    this.heapTop = HEAP_BASE;
    this.staging = null;
    for (const m of parsed?.members ?? []) {
      const raw = await this.iteron.core.inflateMember(m);
      const meta = claimMeta(m);
      const member = claimMember(m.name, raw, {
        kind: m.kindName ?? m.kind, media: m.media, meta,
      });
      if (m.name === STAGING_MEMBER) {
        this.staging = member;
        continue;
      }
      const base = meta.base ? parseInt(meta.base) : this.heapTop;
      this.claims.set(m.name, {
        member, base, size: raw.length,
        perms: meta.perms || "rw", dirty: false,
      });
      this.heapTop = Math.max(this.heapTop, base + raw.length);
    }
    return this;
  }

  // ensure the staging arena member exists (created on first use)
  async ensureStaging() {
    if (this.staging) return this.staging;
    const data = new Uint8Array(STAGING_SIZE);
    this.staging = {
      name: STAGING_MEMBER, kind: "ramdump", codec: "auto",
      data, media: "arena",
      meta: JSON.stringify({ base: "0x0", size: STAGING_SIZE, perms: "rw", staging: true }),
      stagedLen: 0, dirty: false,
    };
    return this.staging;
  }

  // allocate a claim of `size` bytes; returns claim record
  async alloc(name, size, { kind = "file", perms = "rw", media = "" } = {}) {
    if (this.claims.has(name)) throw new Error(`claim ${name} exists`);
    const base = this.heapTop;
    if (!Number.isSafeInteger(size) || size < 0 || !Number.isSafeInteger(base + size))
      throw new Error("claim size invalid");
    const data = new Uint8Array(size);
    const meta = { base: "0x" + base.toString(16), size, perms };
    const member = claimMember(name, data, { kind, media, meta });
    const claim = { member, base, size, perms, dirty: true };
    this.claims.set(name, claim);
    this.heapTop = base + size;
    return claim;
  }

  get(name) { return this.claims.get(name) ?? null; }

  list() {
    return [...this.claims.entries()].map(([name, claim]) => ({
      name, base: claim.base, size: claim.size, perms: claim.perms,
      dirty: claim.dirty, kind: claim.member.kind, media: claim.member.media,
      meta: claim.member.meta,
    }));
  }

  free(name) {
    const claim = this.claims.get(name);
    if (!claim) return false;
    this.claims.delete(name);
    if (claim.base + claim.size === this.heapTop) {
      this.heapTop = Math.max(HEAP_BASE, ...[...this.claims.values()].map(c => c.base + c.size));
    }
    return true;
  }

  upsertMember(name, data, { kind = "file", media = "", meta = {} } = {}) {
    if (typeof name !== "string" || !name || name === STAGING_MEMBER ||
        !(data instanceof Uint8Array))
      throw new Error("claim_member_invalid");
    const existing = this.claims.get(name);
    if (existing) {
      if (!existing.perms.includes("w")) throw new Error(`claim ${name} is ${existing.perms}`);
      const member = claimMember(name, data, { kind, media, meta });
      existing.member = member;
      existing.size = data.length;
      existing.dirty = true;
      return existing;
    }
    const base = this.heapTop;
    if (!Number.isSafeInteger(base + data.length)) throw new Error("claim size invalid");
    const member = claimMember(name, data, { kind, media, meta: {
      base: `0x${base.toString(16)}`, size: data.length, perms: "rw", ...meta,
    } });
    const claim = { member, base, size: data.length, perms: "rw", dirty: true };
    this.claims.set(name, claim);
    this.heapTop = base + data.length;
    return claim;
  }

  // read region -> bytes (member data is always raw post-normalize)
  async read(name, off = 0, len = null) {
    const c = this.claims.get(name);
    if (!c) throw new Error(`no claim ${name}`);
    if (!Number.isSafeInteger(off) || off < 0 ||
        (len !== null && (!Number.isSafeInteger(len) || len < 0)))
      throw new Error("read range invalid");
    return c.member.data.slice(off, len == null ? undefined : off + len);
  }

  // write into a claim (marks dirty; persists on commit)
  async write(name, bytes, off = 0) {
    const c = this.claims.get(name);
    if (!c) throw new Error(`no claim ${name}`);
    if (!c.perms.includes("w")) throw new Error(`claim ${name} is ${c.perms}`);
    if (!Number.isSafeInteger(off) || off < 0 || !(bytes instanceof Uint8Array))
      throw new Error("write range invalid");
    if (off + bytes.length > c.member.data.length) throw new Error("write exceeds claim");
    c.member.data.set(bytes, off);
    c.dirty = true;
    return c;
  }

  // staging write: external bytes land in the arena before commit.
  // stagedLen tracks the high-water mark so commit() emits only real data.
  async stage(bytes, off = 0) {
    const s = await this.ensureStaging();
    const view = s.data instanceof Uint8Array ? s.data : new Uint8Array(s.data);
    if (!Number.isSafeInteger(off) || off < 0 || !(bytes instanceof Uint8Array))
      throw new Error("staging range invalid");
    if (off + bytes.length > view.length) throw new Error("staging overflow");
    view.set(bytes, off);
    s.stagedLen = Math.max(s.stagedLen ?? 0, off + bytes.length);
    s.dirty = true;
    return s;
  }

  // commit staged bytes -> named claim (arena consumed, reusable after)
  async commit(name, { kind = "file", media = "" } = {}) {
    const s = await this.ensureStaging();
    const len = s.stagedLen ?? s.data.length;
    const bytes = s.data.slice(0, len);
    const claim = await this.alloc(name, bytes.length, { kind, media });
    claim.member.data = bytes;
    claim.dirty = true;
    s.stagedLen = 0;
    s.dirty = false;
    return claim;
  }

  // seal: sha256 over a claim's raw bytes via ITERON
  async seal(name) {
    const c = this.claims.get(name);
    if (!c) throw new Error(`no claim ${name}`);
    return this.iteron.core.sha256(c.member.data);
  }

  // members for iteron.commit() — includes staging arena when present
  members() {
    const out = [...this.claims.values()].map(c => c.member);
    if (this.staging) out.push(this.staging);
    return out;
  }

  // persist whole space as new .skcs volume
  async save(flags = 0) {
    return this.iteron.commit(this.members(), flags);
  }
}

// ---- skylum/persist.js ----
// persist.js — SKYLUM persistence: .skcs volumes in OPFS.
// Origin Private File System is the real browser persistence lane
// (structured, no quota juggling, survives reloads). Capability-detected;
// reports honest availability — never a stub.

const PERSIST_DIR = "skyos";

function opfsSupported() {
  return typeof navigator !== "undefined" &&
         !!navigator.storage && typeof navigator.storage.getDirectory === "function";
}

async function persistDir() {
  if (!opfsSupported()) throw new Error("OPFS unavailable (needs secure context)");
  const root = await navigator.storage.getDirectory();
  return await root.getDirectoryHandle(PERSIST_DIR, { create: true });
}

// save an ITERON state volume (.skcs bytes) under `name`
async function saveVolume(name, skcsBytes) {
  const d = await persistDir();
  const fh = await d.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(skcsBytes instanceof Uint8Array ? skcsBytes : new Uint8Array(skcsBytes));
  await w.close();
  return name;
}

// load a volume -> Uint8Array (.skcs bytes) or null
async function loadVolume(name) {
  try {
    const d = await persistDir();
    const fh = await d.getFileHandle(name);
    const f = await fh.getFile();
    return new Uint8Array(await f.arrayBuffer());
  } catch (e) {
    if (e.name === "NotFoundError") return null;
    throw e;
  }
}

async function listVolumes() {
  const d = await persistDir();
  const names = [];
  for await (const [name] of d.entries()) names.push(name);
  return names.sort();
}

async function deleteVolume(name) {
  const d = await persistDir();
  await d.removeEntry(name);
}

// high-level: persist ITERON's current stateBlob
async function saveIteron(iteron, name = "state.skcs") {
  return saveVolume(name, iteron.stateBlob);
}

async function loadIteron(iteron, name = "state.skcs") {
  const bytes = await loadVolume(name);
  if (!bytes) return false;
  iteron.stateBlob = bytes;
  return true;
}

// aggregate namespace — survives ESM->classic-script stripping in the
// quine bundle where `import * as persist` has no equivalent.
const persist = {
  PERSIST_DIR, opfsSupported, saveVolume, loadVolume,
  listVolumes, deleteVolume, saveIteron, loadIteron,
};

// ---- skylum/seats.js ----
// seats.js — SKYLUM task/seat scheduler: fuel-metered cooperative lanes.
// QSC-V1 convention: seats get deterministic fuel budgets; a task is a
// generator that yields once per step. The scheduler advances each ready
// seat by one quantum per tick — deterministic, no wall-clock in the
// core path. Receipts record steps/fuel for audit.

class Seat {
  constructor(id, fuel) {
    this.id = id;
    this.fuelMax = fuel;      // budget granted at seat() time
    this.fuel = fuel;         // remaining fuel units
    this.task = null;         // generator
    this.steps = 0;
    this.done = false;
    this.result = undefined;
  }

  submit(taskFn, fuel = this.fuelMax) {
    // taskFn: generator function — each .next() = one step
    this.task = taskFn();
    this.fuel = fuel;
    this.steps = 0;
    this.done = false;
    return this;
  }

  // advance one step; returns true while task alive
  step() {
    if (!this.task || this.done || this.fuel <= 0) { this.done = true; return false; }
    const r = this.task.next();
    this.fuel -= 1;
    this.steps += 1;
    if (r.done) { this.done = true; this.result = r.value; }
    return !this.done;
  }
}

class Scheduler {
  constructor(iteron = null) {
    this.iteron = iteron;
    this.seats = new Map();
    this.receipts = [];
    this.tickCount = 0;
  }

  seat(id, fuel = 1024) {
    const s = new Seat(id, fuel);
    this.seats.set(id, s);
    return s;
  }

  submit(id, taskFn, fuel) {
    let s = this.seats.get(id);
    if (!s) s = this.seat(id);
    return s.submit(taskFn, fuel ?? s.fuelMax);
  }

  // one scheduling quantum: every live seat advances one step (round-robin
  // order = insertion order — deterministic)
  tick() {
    this.tickCount += 1;
    let ran = 0;
    for (const s of this.seats.values()) {
      if (s.step()) ran += 1;
    }
    return ran;
  }

  // run until all seats done or maxTicks — returns receipts.
  // maxTicks bounds THIS run, not the scheduler's lifetime.
  run(maxTicks = 1 << 20) {
    const start = this.tickCount;
    while (this.tickCount - start < maxTicks) {
      const ran = this.tick();
      if (ran === 0) break;
    }
    return this.receipt();
  }

  receipt() {
    const r = {
      tick: this.tickCount,
      seats: [...this.seats.values()].map(s => ({
        id: s.id, steps: s.steps, fuel_left: Math.max(0, s.fuel), done: s.done,
      })),
    };
    this.receipts.push(r);
    return r;
  }
}

// ---- skylum/optical.js ----
// optical.js — SKYLUM optical lane: raster codec + half-duplex session
// machine for the screen↔camera channel (LAYERS.md §3 door 4).
//
// Raster law: an n×n grid of luminance cells; each cell's gray level IS
// the byte value (0–255). The first HEADER cells are a self-describing
// header so a decoder needs no out-of-band length:
//   [0] 'S' [1] 'K' [2] ver=1 [3] n(u8) [4..6] len u24 BE
//   [7..8] fletcher16(header bytes 2..6) [9] reserved=0
// Payload cells follow row-major. Rendering (cell size, canvas, WebGL)
// is ECHO's job; this module only maps bytes ↔ cell luminances and runs
// the session pool. DOM-free — fully testable on synthetic buffers.

const OPTICAL_VERSION = 1;
const OPTICAL_HEADER = 10;

// fletcher-16 over a byte range — named checksum, 6 lines.
function fletcher16(bytes, off = 0, len = bytes.length - off) {
  let a = 0, b = 0;
  for (let i = 0; i < len; i++) {
    a = (a + bytes[off + i]) % 255;
    b = (b + a) % 255;
  }
  return (b << 8) | a;
}

// frame bytes -> { n, lum: Uint8Array(n*n) } — lum values are the gray
// level each cell should be painted with (0=black … 255=white).
function rasterEncode(frame) {
  const len = frame.length;
  const n = Math.ceil(Math.sqrt(OPTICAL_HEADER + len));
  if (n > 255) throw new Error("raster_too_large");
  const lum = new Uint8Array(n * n);
  lum[0] = 0x53; // 'S'
  lum[1] = 0x4b; // 'K'
  lum[2] = OPTICAL_VERSION;
  lum[3] = n;
  lum[4] = (len >> 16) & 0xff;
  lum[5] = (len >> 8) & 0xff;
  lum[6] = len & 0xff;
  const crc = fletcher16(frame);
  lum[7] = (crc >> 8) & 0xff;
  lum[8] = crc & 0xff;
  lum[9] = 0;
  lum.set(frame, OPTICAL_HEADER);
  return { n, lum };
}

// sampled luminances (n*n bytes, row-major, cell-center) -> frame or null.
// Returns null on any inconsistency — never fabricates a frame.
function rasterDecode(lum, n) {
  if (!n || lum.length !== n * n) return null;
  if (lum[0] !== 0x53 || lum[1] !== 0x4b) return null;       // magic
  if (lum[2] !== OPTICAL_VERSION) return null;               // version
  if (lum[3] !== n) return null;                             // grid self-check
  const len = (lum[4] << 16) | (lum[5] << 8) | lum[6];
  const need = OPTICAL_HEADER + len;
  if (len <= 0 || need > n * n) return null;                 // bounds
  const frame = lum.slice(OPTICAL_HEADER, need);
  const crc = fletcher16(frame);
  if (((crc >> 8) & 0xff) !== lum[7] || (crc & 0xff) !== lum[8]) return null;
  return frame;
}

// Sample an RGBA pixel buffer into cell luminances by averaging the
// center quarter of each cell (robust to cell-edge bleed). `pixels` is a
// Uint8Array/Uint8ClampedArray of w*h*4 bytes; `cells` n×n. `cellSize`
// may be fractional — real captures almost never land on integer cell
// widths, and integer truncation drifts sampling off-cell by the last
// column. Anchored top-left.
function sampleRaster(pixels, width, height, n, cellSize) {
  if (n * cellSize > width || n * cellSize > height) return null;
  const lum = new Uint8Array(n * n);
  for (let cy = 0; cy < n; cy++) {
    for (let cx = 0; cx < n; cx++) {
      let sum = 0, count = 0;
      const x0 = Math.floor((cx + 0.25) * cellSize);
      const y0 = Math.floor((cy + 0.25) * cellSize);
      const x1 = Math.max(x0 + 1, Math.floor((cx + 0.75) * cellSize));
      const y1 = Math.max(y0 + 1, Math.floor((cy + 0.75) * cellSize));
      for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
          const p = (y * width + x) * 4;
          // ITU-R BT.601 luma — matches how displays render gray
          sum += (pixels[p] * 299 + pixels[p + 1] * 587 + pixels[p + 2] * 114) / 1000;
          count++;
        }
      }
      lum[cy * n + cx] = Math.round(sum / count);
    }
  }
  return lum;
}

// ---------------------------------------------------------------------------
// FramePool — per-session SKCF accumulation shared by app + OpticalLink.
// ---------------------------------------------------------------------------

class FramePool {
  constructor() {
    // session_id -> {k, block_len, total_len, codec_id, carrier_id,
    //                frames: Map(seq -> frame), payload}
    this.sessions = new Map();
  }

  // Ingest one parsed SKCF frame (from core.skcfParse). Returns
  // {accepted, sessionId, seq, complete, progress} — accepted=false for
  // foreign/malformed frames, complete=true once k frames are held.
  ingest(frame, parsed) {
    if (!parsed || parsed.verdict !== 0) return { accepted: false };
    let pool = this.sessions.get(parsed.session_id);
    if (!pool) {
      pool = { k: parsed.k, block_len: parsed.block_len,
        total_len: parsed.total_len, codec_id: parsed.codec_id,
        carrier_id: parsed.carrier_id, frames: new Map(), payload: null };
      this.sessions.set(parsed.session_id, pool);
    }
    pool.frames.set(parsed.seq, frame);
    return { accepted: true, sessionId: parsed.session_id, seq: parsed.seq,
      complete: pool.frames.size >= pool.k, progress: pool.frames.size };
  }

  // Serialize a session's frames into the fountain blob format:
  // u32 n | {u32 len, frame}*  (matches core.fountainDecode input).
  blob(sessionId) {
    const pool = this.sessions.get(sessionId);
    if (!pool) return null;
    const frames = [...pool.frames.values()];
    const out = new Uint8Array(4 + frames.reduce((n, f) => n + 4 + f.length, 0));
    const dv = new DataView(out.buffer);
    dv.setUint32(0, frames.length, true);
    let pos = 4;
    for (const f of frames) {
      dv.setUint32(pos, f.length, true); pos += 4;
      out.set(f, pos); pos += f.length;
    }
    return out;
  }
}

// ---------------------------------------------------------------------------
// OpticalLink — half-duplex transceiver machine over ONE light channel.
// A node is either transmitting a fountain carousel or listening for one;
// never both. States: idle | tx | rx | done. Payload semantics stay at
// the app layer (the stream can carry anything — including reemit() of
// the very machine doing the transmitting).
// ---------------------------------------------------------------------------

class OpticalLink {
  constructor(iteron, { blockLen = 900 } = {}) {
    this.iteron = iteron;
    this.blockLen = blockLen;
    this.pool = new FramePool();
    this.state = "idle";
    this.frames = [];        // current TX carousel (frame bytes)
    this.cursor = 0;
    this.sessionId = null;
    this.onPayload = null;   // (sessionId, payloadBytes) => void
    this.onState = null;     // (state, info) => void
  }

  _set(state, info) {
    this.state = state;
    this.onState?.(state, info);
  }

  // Build a TX carousel for a payload. Returns the frame list; the
  // caller (app/host) advances cursor and renders each frame's raster.
  tx(payload, { sessionId } = {}) {
    const sid = sessionId ?? ((Math.random() * 0xffff) | 0);
    const blob = this.iteron.core.fountainEncode(payload, this.blockLen, sid);
    this.frames = [...this.iteron.core.iterFrames(blob)];
    if (!this.frames.length) throw new Error("fountain_encode_empty");
    this.cursor = 0;
    this.sessionId = sid;
    this._set("tx", { sessionId: sid, frames: this.frames.length, bytes: payload.length });
    return this.frames;
  }

  // Next carousel frame — carousel loops forever until txStop() or
  // rxStart(), so a receiver joining mid-stream can still complete.
  txNext() {
    if (this.state !== "tx" || !this.frames.length) return null;
    const frame = this.frames[this.cursor];
    this.cursor = (this.cursor + 1) % this.frames.length;
    return frame;
  }

  rxStart() {
    this._set("rx", { sessionId: this.sessionId });
  }

  // Feed a raster-decoded frame during rx. Parses + pools; on reaching
  // ≥k distinct frames attempts fountain decode. Returns ingest result
  // plus {decoded} when a payload completed.
  async rxFrame(frame) {
    const parsed = this.iteron.core.skcfParse(frame);
    const result = this.pool.ingest(frame, parsed);
    if (result.complete) {
      const pool = this.pool.sessions.get(result.sessionId);
      if (pool && !pool.payload) {
        const out = this.iteron.core.fountainDecode(
          this.pool.blob(result.sessionId),
          pool.total_len, pool.block_len, result.sessionId);
        if (out?.length) {
          pool.payload = out;
          this.onPayload?.(result.sessionId, out);
          this._set("done", { sessionId: result.sessionId, bytes: out.length });
          return { ...result, decoded: out };
        }
      }
    }
    return result;
  }

  stop() { this._set("idle", {}); }
}

// ---- skylum/astro.js ----
// astro.js — SKYLUM celestial service: real astronomy over UTC.
// Sun: standard J2000 low-precision ephemeris (~0.01°). Moon: truncated
// Meeus perturbation series (~1°, honest approximation — sufficient for
// sky maps, not occultations). Stars: fixed J2000 navigational catalog.
// All functions are pure and DOM-free; ECHO renders, SKYLUM computes.

const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const norm360 = x => ((x % 360) + 360) % 360;
const norm24 = x => ((x % 24) + 24) % 24;

function julianDate(date = new Date()) {
  return date.getTime() / 86400000 + 2440587.5;
}

// GMST in hours (IAU 1982 polynomial form).
function gmst(date = new Date()) {
  const d = julianDate(date) - 2451545.0;
  return norm24(18.697374558 + 24.06570982441908 * d);
}

// Solar apparent RA (hours) and declination (deg), plus the subsolar
// point on the geoid (lat = dec, lng = -GHA).
function solarState(date = new Date()) {
  const n = julianDate(date) - 2451545.0;
  const L = norm360(280.460 + 0.9856474 * n);          // mean longitude
  const g = (357.528 + 0.9856003 * n) * D2R;           // mean anomaly
  const lambda = norm360(L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * D2R;
  const eps = (23.439 - 0.0000004 * n) * D2R;          // obliquity
  const ra = norm24(Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda)) * R2D / 15);
  const dec = Math.asin(Math.sin(eps) * Math.sin(lambda)) * R2D;
  const gha = norm360(15 * (gmst(date) - ra));         // Greenwich hour angle
  return { ra, dec, gha, lng: gha > 180 ? 360 - gha : -gha, lat: dec };
}

// Back-compat name used by globe.js terminator rendering.
const subsolarPoint = date => {
  const s = solarState(date);
  return { lat: s.lat, lng: s.lng };
};

// Geocentric lunar RA/Dec plus phase angle (deg) and illuminated
// fraction [0,1]. Truncated to the principal perturbation terms.
function lunarState(date = new Date()) {
  const n = julianDate(date) - 2451545.0;
  const Lp = norm360(218.316 + 13.176396 * n);         // mean longitude
  const Mp = (134.963 + 13.064993 * n) * D2R;          // mean anomaly (moon)
  const Ms = (357.529 + 0.9856003 * n) * D2R;          // mean anomaly (sun)
  const D = (297.850 + 12.190749 * n) * D2R;           // mean elongation
  const F = (93.272 + 13.229350 * n) * D2R;            // argument of latitude
  const lambda = norm360(Lp + 6.289 * Math.sin(Mp) + 1.274 * Math.sin(2 * D - Mp)
    + 0.658 * Math.sin(2 * D) + 0.214 * Math.sin(2 * Mp)
    - 0.186 * Math.sin(Ms) - 0.114 * Math.sin(2 * F)) * D2R;
  const beta = (5.128 * Math.sin(F) + 0.280 * Math.sin(Mp + F)
    + 0.277 * Math.sin(Mp - F) + 0.173 * Math.sin(2 * D - F)
    + 0.055 * Math.sin(2 * D + F - Mp) + 0.046 * Math.sin(2 * D - F - Mp)
    + 0.041 * Math.sin(2 * D - Ms)) * D2R;
  const eps = (23.439 - 0.0000004 * n) * D2R;
  const ra = norm24(Math.atan2(
    Math.sin(lambda) * Math.cos(eps) - Math.tan(beta) * Math.sin(eps),
    Math.cos(lambda)) * R2D / 15);
  const dec = Math.asin(Math.sin(beta) * Math.cos(eps)
    + Math.cos(beta) * Math.sin(eps) * Math.sin(lambda)) * R2D;
  const phase = 180 - D * R2D - 6.289 * Math.sin(Mp) + 2.100 * Math.sin(Ms)
    - 1.274 * Math.sin(2 * D - Mp) - 0.658 * Math.sin(2 * D)
    - 0.214 * Math.sin(2 * Mp) - 0.110 * Math.sin(D);
  return { ra, dec, phase: norm360(phase), illum: (1 + Math.cos(phase * D2R)) / 2 };
}
