<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ITERON — SkyOS Core</title>
<style>
  body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#0b0e14;color:#c9d1d9;max-width:1000px;margin:2em auto;padding:0 1em}
  h1{color:#58a6ff;font-size:1.2em}
  h2{color:#8b949e;font-size:.95em;margin-top:1.4em}
  pre{background:#161b22;padding:.6em;overflow:auto;border:1px solid #30363d;white-space:pre-wrap;word-break:break-all}
  table{border-collapse:collapse;width:100%;font-size:.82em}
  td,th{border:1px solid #30363d;padding:.25em .5em;text-align:left}
  th{color:#58a6ff}
  .blob{display:none}
  .dim{color:#6e7681}
  button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:.3em .9em;cursor:pointer;font:inherit}
  button:hover{border-color:#58a6ff}
</style>
</head>
<body>
<h1>ITERON <span class="dim">— SkyOS core engine · self-reemitting quine</span></h1>
<p class="dim" id="verdict">boot…</p>
<pre id="log"></pre>
<h2>state volume (.skcs)</h2>
<table id="members"><tr><th>name</th><th>kind</th><th>codec</th><th>size</th><th>sha256</th><th>actions</th></tr></table>
<div id="detail"></div>
<h2>reemit</h2>
<p><button id="reemit-btn">reemit()</button> <button id="dl-btn">download artifact</button></p>
<pre id="reemit-out" class="dim">—</pre>

<!-- slots: literal markers, substituted at build / reemit -->
<script type="application/octet-stream" class="blob" id="iteron-wasm">__WASM_B64__</script>
<script type="application/octet-stream" class="blob" id="iteron-state">__STATE_B64__</script>
<script type="application/json" class="blob" id="iteron-manifest">__MANIFEST__</script>
<script type="application/octet-stream" class="blob" id="iteron-tmpl">__TEMPLATE_B64__</script>
<script type="application/octet-stream" class="blob" id="iteron-engine-src">__ENGINE__</script>

<script>
__ENGINE__
</script>
<script id="iteron-extra-boot">__EXTRA_BOOT__</script>
<script>
// boot harness — template-owned, always present verbatim
(function () {
  const log = m => { document.getElementById('log').textContent += m + '\n'; };
  const B64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function boot() {
    try {
      const core = await IteronCore.create(B64(document.getElementById('iteron-wasm').textContent.trim()));
      const stateB64 = document.getElementById('iteron-state').textContent.trim();
      const manifestStr = document.getElementById('iteron-manifest').textContent;
      const tmplB64 = document.getElementById('iteron-tmpl').textContent.trim();
      const engineSrc = document.getElementById('iteron-engine-src').textContent;
      const extraBootSrc = document.getElementById('iteron-extra-boot')?.textContent ?? "";
      const iteron = new Iteron(core, B64(stateB64), JSON.parse(manifestStr),
        { wasmB64: document.getElementById('iteron-wasm').textContent.trim(),
          stateB64, manifestStr, tmplB64, engineSrc, extraBootSrc });
      window.ITERON = iteron;
      const info = await iteron.inspect();
      log('ITERON boot — wasm ' + core.e.memory.buffer.byteLength + 'B, ' +
          info.members.length + ' members, flags=0x' + info.flags.toString(16));
      document.getElementById('verdict').textContent =
        'state: ' + info.members.length + ' members · engine online';
      const tbl = document.getElementById('members');
      for (const m of info.members) {
        const tr = document.createElement('tr');
        const sha = m.data ? Array.from(core.sha256(m.data)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,16) : '—';
        tr.innerHTML = '<td></td><td></td><td></td><td></td><td class="dim">' + sha + '…</td><td></td>';
        tr.children[0].textContent = m.name;
        tr.children[1].textContent = m.kindName;
        tr.children[2].textContent = m.codecName + (m.raw_size !== m.size ? ' (' + m.size + '→' + m.raw_size + ')' : '');
        tr.children[3].textContent = m.data ? m.data.length + 'B' : m.size + 'B';
        const btn = document.createElement('button');
        btn.textContent = 'view';
        btn.onclick = () => {
          const d = document.getElementById('detail');
          const txt = new TextDecoder().decode(m.data.slice(0, 8192));
          d.innerHTML = '<h2>' + m.name + '</h2><pre></pre>';
          d.querySelector('pre').textContent = txt + (m.data.length > 8192 ? '\n… truncated' : '');
        };
        tr.children[5].appendChild(btn);
        tbl.appendChild(tr);
      }
      document.getElementById('reemit-btn').onclick = () => {
        const html = iteron.reemit();
        document.getElementById('reemit-out').textContent =
          'reemit() → ' + html.length + ' bytes (template ' + tmplB64.length + ' b64 chars)';
        window.__LAST_REEMIT = html;
      };
      document.getElementById('dl-btn').onclick = () => {
        const html = iteron.reemit();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([html], {type:'text/html'}));
        a.download = 'iteron.html'; a.click();
      };
      log('VERDICT: ITERON online — reemit() available');
    } catch (err) { log('FATAL: ' + (err.stack || err)); }
  }
  window.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
